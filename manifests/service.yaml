apiVersion: v1
kind: Service
metadata:
  name: nginx-hello-world
  labels:
    app.kubernetes.io/name: nginx-hello-world
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-hello-world
  ports:
    - name: http
      port: 80
      targetPort: http
