apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-hello-world
  labels:
    app.kubernetes.io/name: nginx-hello-world
    app.kubernetes.io/component: web
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Hello from Argo CD</title>
        <style>
          body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17202a;
            background: #f6f8fb;
          }

          main {
            max-width: 42rem;
            padding: 2rem;
            text-align: center;
          }

          h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(2rem, 8vw, 4rem);
          }

          p {
            margin: 0;
            font-size: 1.125rem;
            line-height: 1.6;
          }
        </style>
      </head>
      <body>
        <main>
          <h1>Hello 2a, Argo CD.</h1>
          <p>This nginx app is deployed from the argocd-app-example1 Git repository.</p>
        </main>
      </body>
    </html>
